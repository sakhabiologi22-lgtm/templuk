<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk Akun</title>
  <link rel="stylesheet" href="style-login.css">
</head>
<body>

  <div class="login-container">
    <h2>Masuk Aplikasi</h2>
    
    <div id="pesanMasuk" class="pesan" style="display: none;"></div>

    <form onsubmit="event.preventDefault(); lakukanMasuk();">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Masukkan username" required>
      </div>

      <div class="form-group">
        <label for="password">Kata Sandi</label>
        <input type="password" id="password" placeholder="Masukkan kata sandi" required>
      </div>

      <button type="submit" class="btn-submit">
        <span id="labelMasuk">Masuk</span>
      </button>
    </form>

    <div class="form-footer">
      <p>Belum punya akun? <a href="register.html">Daftar sekarang</a></p>
      <p style="margin-top: 10px;"><a href="../index.html" class="back-link">&larr; Kembali ke Utama</a></p>
    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
