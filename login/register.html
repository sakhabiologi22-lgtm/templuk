<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Akun - Portofolio Sinematik</title>
  <link rel="stylesheet" href="style-login.css">
</head>
<body>

  <div class="auth-card">
    <div class="auth-header">
      <h2>Buat Akun Baru</h2>
    </div>

    <div id="pesanDaftar" class="pesan-box" style="display: none;"></div>

    <form onsubmit="event.preventDefault(); lakukanDaftar();">
      <div class="field-group">
        <label for="regUsername">Username Baru</label>
        <input type="text" id="regUsername" placeholder="Buat nama pengguna unik" required>
      </div>

      <div class="field-group">
        <label for="regPassword">Kata Sandi</label>
        <input type="password" id="regPassword" placeholder="Buat kata sandi baru" required>
      </div>

      <button type="submit" class="btn-auth-submit animation-btn">
        <span id="labelDaftar">Daftar</span>
      </button>
    </form>

    <div class="auth-footer">
      <p>Sudah memiliki akun? <a href="index.html">Log In di sini</a></p>
    </div>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
