<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun Baru</title>
  <link rel="stylesheet" href="style-login.css">
</head>
<body>

  <div class="login-container">
    <h2>Registrasi Akun</h2>
    
    <div id="pesanDaftar" class="pesan" style="display: none;"></div>

    <form onsubmit="event.preventDefault(); lakukanDaftar();">
      <div class="form-group">
        <label for="regUsername">Username Baru</label>
        <input type="text" id="regUsername" placeholder="Buat username unik" required>
      </div>

      <div class="form-group">
        <label for="regPassword">Kata Sandi</label>
        <input type="password" id="regPassword" placeholder="Buat kata sandi minimal 3 karakter" required>
      </div>

      <button type="submit" class="btn-submit">
        <span id="labelDaftar">Daftar</span>
      </button>
    </form>

    <div class="form-footer">
      <p>Sudah punya akun? <a href="index.html">Log In di sini</a></p>
    </div>
  </div>

  <script src="js/register.js"></script>
</body>
</html>
